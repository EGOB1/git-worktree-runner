#!/usr/bin/env bash

find_claude_executable() {
  local cmd exe_path cmd_type

  if [[ -x "$HOME/.claude/local/claude" && ! -d "$HOME/.claude/local/claude" ]]; then
    printf '%s\n' "$HOME/.claude/local/claude"
    return 0
  fi

  for cmd in claude claude-code; do
    if exe_path="$(type -P "$cmd" 2>/dev/null)" && [[ -n "$exe_path" ]]; then
      [[ "$exe_path" == /* ]] || exe_path="$PWD/$exe_path"
      printf '%s\n' "$exe_path"
      return 0
    fi
  done

  for cmd in claude claude-code; do
    cmd_type="$(shopt -s expand_aliases; type -t "$cmd" 2>/dev/null)" || continue
    case "$cmd_type" in
      function|alias)
        printf '%s\n' "$cmd"
        return 0
        ;;
    esac
  done

  return 1
}

ai_can_start() {
  find_claude_executable >/dev/null 2>&1
}

# Usage: ai_start path [args...]
ai_start() {
  local path claude_cmd cmd_type
  local configured_args=("${GTR_AI_CMD_ARGS[@]}")

  if (( $# == 0 )); then
    log_error "Usage: ai_start path [args...]"
    return 1
  fi
  path="$1"
  shift

  if ! claude_cmd="$(find_claude_executable)" || [[ -z "$claude_cmd" ]]; then
    log_error "Claude Code not found. Install from https://claude.com/claude-code"
    log_info "The CLI is called 'claude' (or 'claude-code' in older versions)"
    return 1
  fi

  if [[ ! -d "$path" ]]; then
    log_error "Directory not found: $path"
    return 1
  fi

  cmd_type="$(shopt -s expand_aliases; type -t "$claude_cmd" 2>/dev/null)" || cmd_type=""
  (
    CDPATH= cd -- "$path" || exit
    if [[ "$cmd_type" == alias ]]; then
      # Parse the known command name to expand its alias; keep arguments quoted.
      set -- "${configured_args[@]}" "$@"
      shopt -s expand_aliases
      eval "$claude_cmd \"\$@\""
    else
      "$claude_cmd" "${configured_args[@]}" "$@"
    fi
  )
}
